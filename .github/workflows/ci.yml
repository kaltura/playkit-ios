name: CI

on:
  push:
    branches: [ "develop" ]
    paths-ignore:
      - 'docs/**'
      - 'iOSTestApp/**'
      - 'tvOSTestApp/**'
      - 'Example/**'
      - 'TestApp/**'
      - 'LICENSE'
      - '*.md'
      
concurrency: 
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "CocoaPods linting"
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v4

    - name: Updating Cocoapods
      run: gem install cocoapods

    - name: Updating CocoaPods repo
      run: pod repo update

    - name: Pod linting
      run: pod lib lint --fail-fast --verbose --allow-warnings

  SPM:
    name: "Build SPM"
    runs-on: macos-26
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: "OS=26.2,name=iPhone 17"
            name: "iOS"
            scheme: "PlayKit-Package"
          - destination: "OS=26.2,name=Apple TV"
            name: "tvOS"
            scheme: "PlayKit-Package"
    steps:
      - name: Force Xcode 26.3
        run: sudo xcode-select -switch /Applications/Xcode_26.3.app
      - uses: actions/checkout@v4
      - name: ${{ matrix.name }}
        run: set -o pipefail && env NSUnbufferedIO=YES xcodebuild -scheme "${{ matrix.scheme }}" -destination "${{ matrix.destination }}" clean test | xcpretty
        
